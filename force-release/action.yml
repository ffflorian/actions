---
name: Force Release
description: Force a release by updating semantic-release release rules and runing semantic-release
author: 'Florian Imdahl <git@ffflorian.de>'
branding: {icon: 'git-commit', color: 'blue'}

inputs:
  GITHUB_TOKEN:
    description: 'GitHub token used to check out the repository and run semantic-release.'
    required: true
  git_authorship:
    description: 'The authorship to use for the commit. Format: "Name <email>".'
    required: true
  assets:
    description: 'Newline-separated asset paths for @semantic-release/git.'
    required: false
    default: 'CHANGELOG.md'

runs:
  using: composite

  steps:
    - name: Checkout repository
      uses: actions/checkout@v6.0.2
      with:
        token: ${{ inputs.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v6.4.0
      with:
        node-version: 26

    - name: Force release
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        INPUT_GIT_AUTHORSHIP: ${{ inputs.git_authorship }}
        INPUT_ASSETS: ${{ inputs.assets }}
      run: node "${{ github.action_path }}/dist/index.js"
